[package]
name = "secrets"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
base64 = "0.23.1"
memchr = "2.8.3"
rustix = { version = "1.1.5", features = ["event", "fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
signal-hook = "0.4.5"
tokio = { version = "1.53.2", features = ["rt", "macros", "net", "io-util", "sync", "signal"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
