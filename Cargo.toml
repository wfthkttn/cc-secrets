[package]
name = "secrets"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
base64 = "0.23.1"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
memchr = "2.8.3"
rsa = "0.9.10"
rustix = { version = "1.1.5", features = ["event", "fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sha2 = "0.10.9"
signal-hook = "0.4.5"
ssh-encoding = { version = "0.2.0", features = ["alloc"] }
ssh-key = { version = "0.6.7", features = ["ed25519", "rsa", "p256", "p384"] }
tokio = { version = "1.53.2", features = ["rt", "macros", "net", "io-util", "sync", "signal"] }
zeroize = "1.9.1"

# Unlocking derives a key with 64 MiB of Argon2; unoptimized, the tests would wait seconds on each one.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
